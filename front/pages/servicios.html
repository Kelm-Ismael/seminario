<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servicios</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/empleadoyservicio.css">

</head>

<body>

    <main class="container">

        <header class="page-header">

            <h1>Administración de Servicios</h1>
            <p>Gestión completa de servicios</p>

        </header>

        <section class="card">

            <h2>Nuevo servicio</h2>

            <form id="formServicio">

                <div class="fila">

                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="form-group">
                        <label>Precio</label>
                        <input type="number" step="0.01" id="precio" required>
                    </div>

                </div>

                <div class="fila">

                    <div class="form-group">
                        <label>Duración (min)</label>
                        <input type="number" id="duracion" required>
                    </div>

                    <div class="form-group">
                        <label>Estado</label>

                        <select id="activo">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>

                    </div>

                </div>

                <div class="acciones">
                    <button class="btn btn-primary">
                        Guardar servicio
                    </button>
                    <button class="btn btn-secondary" onclick="history.back()">
                        ← Volver a turnos
                    </button>
                </div>

            </form>

        </section>

        <section class="card">

            <h2>Lista de servicios</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaServicios"></tbody>

            </table>

        </section>

    </main>

    <script type="module" src="../js/servicios/servicios.js"></script>

</body>

</html>
