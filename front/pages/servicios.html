<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servicios</title>

    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/turno.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/global.css">

</head>

<body>

    <main class="container">

        <header class="header">
            <h1>🛠️ Gestión de Servicios</h1>
            <p>Alta y listado de servicios</p>
        </header>

        <nav class="nav-links">
            <a href="https://seminario-pink.vercel.app/">Inicio</a>
        </nav>

        <!-- Formulario de creación -->
        <section class="card">

            <h2>Nuevo servicio</h2>

            <form id="formServicio" class="form-turno">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="precio">Precio</label>
                    <input type="number" step="0.01" id="precio" required>
                </div>

                <div class="form-group">
                    <label for="duracion">Duración (min)</label>
                    <input type="number" id="duracion" required>
                </div>

                <div class="form-group">
                    <label for="activo">Estado</label>
                    <select id="activo">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn-primary">
                        Guardar servicio
                    </button>

                    <button class="btn btn-secondary" onclick="history.back()">
                        ← Volver a turnos
                    </button>
                </div>

            </form>

        </section>

        <!-- Listado de servicios -->
        <section class="card">

            <h2>Servicios registrados</h2>

            <p id="mensaje" class="mensaje">No hay servicios registrados</p>

            <table class="lista-turnos">

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaServicios"></tbody>

            </table>

        </section>

    </main>

     <button type="button" class="btn btn-secondary"
            onclick="window.location.href='https://seminario-pink.vercel.app/'">
        ← Volver
    </button>

    <script type="module" src="../js/servicios/servicios.js"></script>

</body>

</html>
