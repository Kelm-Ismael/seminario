<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - David Martinez</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
            <div>
                <h1 class="logo-title">David Martinez</h1>
                <p class="logo-subtitle">Estilista Unisex</p>
            </div>
        </header>

        <main class="auth-body">
            <div class="auth-card">

                <div class="auth-card-header">
                    <h2>¡Bienvenido de nuevo!</h2>
                    <p>Iniciá sesión para continuar</p>
                </div>

                <form id="formLogin">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-icon-group">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email" placeholder="Tu email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon-group">
                            <span class="icon">🔒</span>
                            <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                            <button type="button" id="togglePassword" class="toggle-visibility" aria-label="Mostrar contraseña">👁️</button>
                        </div>
                    </div>

                    <div class="auth-links">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <p id="mensaje" class="mensaje"></p>

                    <button type="submit" class="btn-primary btn-block">Iniciar sesión</button>

                    <div class="divider-text">o continuá con</div>

                    <div class="form-actions form-actions--una">
                        <button type="button" class="btn-social" disabled title="Próximamente">
                            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
                                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
                                <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.33z"/>
                                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
                            </svg>
                            Continuar con Google
                        </button>
                    </div>

                </form>

                <p class="auth-switch">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

            </div>
        </main>

    </div>

    <script type="module" src="../js/login/login.js"></script>

</body>

</html>
