<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Completar registro con Google - David Martinez</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
            <div>
                <h1 class="logo-title">David Martinez</h1>
                <p class="logo-subtitle">Estilista Unisex</p>
            </div>
        </header>

        <main class="auth-body">
            <div class="auth-card auth-card--ancha">

                <div class="auth-card-header">
                    <h2>¡Ya casi termina!</h2>
                    <p>Nos faltan estos datos para completar tu cuenta de Google</p>
                </div>

                <form id="formCompletarGoogle">

                    <div class="fila">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <div class="input-icon-group">
                                <span class="icon">👤</span>
                                <input type="text" id="nombre" name="nombre" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <div class="input-icon-group">
                                <span class="icon">👤</span>
                                <input type="text" id="apellido" name="apellido" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-icon-group">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email" readonly>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de nacimiento *</label>
                            <div class="input-icon-group">
                                <span class="icon">📅</span>
                                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="celular">Celular *</label>
                            <div class="input-icon-group">
                                <span class="icon">📱</span>
                                <span class="celular-prefijo">+54</span>
                                <input type="tel" id="celular" name="celular" placeholder="3794000000" inputmode="numeric" required>
                            </div>
                        </div>
                    </div>

                    <p id="mensaje" class="mensaje"></p>

                    <div class="form-actions form-actions--una">
                        <button type="submit" class="btn-primary">Finalizar registro</button>
                    </div>

                </form>

            </div>
        </main>

    </div>

    <script type="module" src="../js/registro/completarRegistroGoogle.js"></script>

</body>

</html>
