<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - David Martinez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <a href="../index.html" aria-label="Ir al inicio">
                <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
                <div>
                    <h1 class="logo-title">David Martinez</h1>
                    <p class="logo-subtitle">Estilista Unisex</p>
                </div>
            </a>
        </header>

        <main class="auth-body">
            <div class="auth-card auth-card--ancha">

                <div class="auth-card-header">
                    <h2>Creá tu cuenta</h2>
                    <p>Completá tus datos para reservar turnos online</p>
                </div>

                <form id="formRegistro">

                    <div class="fila">
                        <div class="form-group">
                            <label for="nombre">Nombre *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">👤</span>
                                <input type="text" id="nombre" name="nombre" placeholder="John" autocomplete="given-name" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="apellido">Apellido *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">👤</span>
                                <input type="text" id="apellido" name="apellido" placeholder="Doe" autocomplete="family-name" required>
                            </div>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de nacimiento *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">📅</span>
                                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" autocomplete="bday" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="celular">Celular *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">📱</span>
                                <span class="celular-prefijo">+54</span>
                                <input type="tel" id="celular" name="celular" placeholder="3794000000" inputmode="numeric" autocomplete="tel-national" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <div class="input-icon-group">
                            <span class="icon" aria-hidden="true">✉️</span>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña *</label>
                        <div class="input-icon-group">
                            <span class="icon" aria-hidden="true">🔒</span>
                            <input type="password" id="password" name="password" minlength="8"
                                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}"
                                title="Debe tener al menos 8 caracteres, con una mayúscula, una minúscula y un número"
                                autocomplete="new-password" aria-describedby="passwordHint"
                                required>
                            <button type="button" id="togglePassword" class="toggle-visibility" aria-label="Mostrar contraseña">👁️</button>
                        </div>
                        <small id="passwordHint" class="form-hint">Mínimo 8 caracteres, con una mayúscula, una minúscula y un número.</small>
                    </div>

                    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Crear cuenta</button>
                        <div id="googleBtnContainer" class="google-btn-container"></div>
                    </div>

                    <div class="auth-footer">
                        <p class="auth-switch">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
                        <p class="auth-switch">¿Te registraste pero no activaste tu cuenta? <a href="confirmar-cuenta.html">Activar cuenta</a></p>
                    </div>

                </form>

            </div>
        </main>

    </div>

    <script type="module" src="../js/registro/registro.js"></script>
    <script type="module" src="../js/registro/googleAuth.js"></script>

</body>

</html>
