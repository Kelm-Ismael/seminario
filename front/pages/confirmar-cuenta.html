<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmá tu cuenta - David Martinez</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
            <div>
                <h1 class="logo-title">David Martinez</h1>
                <p class="logo-subtitle">Estilista Unisex</p>
            </div>
        </header>

        <main class="auth-body">
            <div class="auth-card">

                <div class="auth-card-header">
                    <h2>Confirmá tu cuenta</h2>
                    <p>Ingresá el email con el que te registraste y el código de 6 dígitos que te enviamos</p>
                </div>

                <form id="formConfirmar">

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <div class="input-icon-group">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="casilleros">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric">
                        <input type="text" class="casillero" maxlength="1" inputmode="numeric">
                    </div>

                    <p id="mensaje" class="mensaje"></p>

                    <button type="submit" class="btn-primary btn-block">Enviar</button>

                    <p class="reenvio">
                        ¿No recibiste el código o ya venció?
                        <button type="button" id="btnReenviar" class="btn-link">Reenviar</button>
                        <span id="cooldown" class="cooldown"></span>
                    </p>

                    <p class="auth-switch"><a href="registro.html">← Volver</a></p>

                </form>

            </div>
        </main>

    </div>

    <script type="module" src="../js/registro/confirmarCuenta.js"></script>

</body>

</html>
