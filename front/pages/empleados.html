<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empleados</title>
    <link rel="stylesheet" href="./css/theme-public.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- <link rel="stylesheet" href="../css/responsive.css"> -->
    <!-- <link rel="stylesheet" href="../css/dashboard.css"> -->
    <!-- <link rel="stylesheet" href="../css/global.css"> -->

</head>

<body>

    <main class="container">

        <header class="header">
            <h1>👤 Gestión de Empleados</h1>
            <p>Alta y listado de empleados</p>
        </header>

        <nav class="nav-links">
            <a href="https://seminario-pink.vercel.app/">Inicio</a>
        </nav>


        <!-- Formulario de creación -->
        <section class="card">

            <h2>Nuevo empleado</h2>

            <form id="formEmpleado" class="form-turno">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="activo">Estado</label>
                    <select id="activo">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn-primary">
                        Guardar empleado
                    </button>

                    <button class="btn btn-secondary" onclick="history.back()">
                        ← Volver a turnos
                    </button>
                </div>

            </form>

        </section>

        <!-- Listado de empleados -->
        <section class="card">

            <h2>Empleados registrados</h2>

            <p id="mensaje" class="mensaje">No hay empleados registrados</p>

            <table class="lista-turnos">

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaEmpleados"></tbody>

            </table>

        </section>

    </main>

     <button type="button" class="btn btn-secondary"
            onclick="window.location.href='../index.html'">
        ← Volver
    </button>

    <script type="module" src="../js/empleado/empleado.js"></script>

</body>

</html>
