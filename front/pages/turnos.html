<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Administrativo - Turnos</title>

    <link rel="stylesheet" href="../css/turno.css">

</head>


<body>


<main class="container">


<header class="header">

    <h1>📅 Panel Administrativo de Turnos</h1>

    <p>Gestión completa de clientes, empleados y reservas</p>

</header>



<!-- ==========================
     CREAR TURNO
========================== -->

<section class="card">


<h2>Crear nuevo turno</h2>


<form id="formTurno">


<div class="fila">


<div class="form-group">

<label>Cliente</label>

<select id="cliente">

<option value="">
Seleccionar cliente
</option>

</select>

</div>



<div class="form-group">

<label>Empleado</label>

<select id="empleado">

<option value="">
Seleccionar empleado
</option>

</select>

</div>



</div>



<div class="fila">


<div class="form-group">

<label>Servicio</label>

<select id="servicio">

<option value="">
Seleccionar servicio
</option>

</select>

</div>



<div class="form-group">

<label>Fecha</label>

<input 
type="datetime-local"
id="fecha"
required
>

</div>


</div>



<button class="btn btn-primary">

Crear turno

</button>



</form>


</section>






<!-- ==========================
     BUSQUEDA Y FILTROS
========================== -->


<section class="card">


<h2>Buscar turnos</h2>



<div class="fila">


<div class="form-group">

<label>Buscar</label>

<input
type="text"
id="busqueda"
placeholder="Cliente, empleado o servicio..."
>


</div>



<div class="form-group">


<label>Estado</label>


<select id="filtroEstado">

<option value="">
Todos
</option>

<option value="pendiente">
Pendiente
</option>

<option value="confirmado">
Confirmado
</option>

<option value="cancelado">
Cancelado
</option>

<option value="finalizado">
Finalizado
</option>


</select>


</div>


</div>


</section>






<!-- ==========================
     TABLA TURNOS
========================== -->


<section class="card">


<h2>Turnos registrados</h2>



<table class="tabla">


<thead>


<tr>

<th>ID</th>

<th>Cliente</th>

<th>Empleado</th>

<th>Servicio</th>

<th>Fecha</th>

<th>Estado</th>

<th>Acciones</th>


</tr>


</thead>




<tbody id="tablaTurnos">


</tbody>



</table>


<p 
id="mensaje"
class="mensaje">
</p>



</section>






<!-- ==========================
     MODAL EDITAR
========================== -->


<div 
id="modalEditar"
class="modal">


<div class="modal-contenido">


<h2>
Editar turno
</h2>



<input 
type="hidden"
id="editarId"
>



<label>Empleado</label>

<select id="editarEmpleado">

</select>




<label>Fecha</label>

<input
type="datetime-local"
id="editarFecha"
>




<label>Estado</label>


<select id="editarEstado">


<option value="pendiente">
Pendiente
</option>


<option value="confirmado">
Confirmado
</option>


<option value="cancelado">
Cancelado
</option>


<option value="finalizado">
Finalizado
</option>


</select>




<div class="acciones">


<button
id="guardarEdicion"
class="btn btn-primary">

Guardar

</button>



<button
id="cerrarModal"
class="btn btn-secondary">

Cerrar

</button>



</div>


</div>


</div>





</main>



<script 
type="module"
src="../js/turnos/turnos.js">
</script>


</body>

</html>
