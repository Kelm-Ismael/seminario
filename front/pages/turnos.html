<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Turnos</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/turnos.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>📅 Gestión de Turnos</h1>
            <p>Reserva y administra tus turnos</p>
        </header>


        <!-- Formulario de creación -->
        <section class="card">

            <h2>Nuevo turno</h2>

            <form id="formTurno" class="form-turno">

                <div class="form-group">

                    <label for="cliente">
                        Cliente
                    </label>

                    <select
                        id="cliente"
                        name="cliente"
                        required
                        autocomplete="off"
                    >
                        <option value="">Cargando clientes...</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="empleado">
                        Empleado
                    </label>

                    <select
                        id="empleado"
                        name="empleado"
                        required
                        autocomplete="off"
                    >
                        <option value="">Cargando empleados...</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="hora">
                        Hora
                    </label>

                    <input
                        type="time"
                        id="hora"
                        name="hora"
                        required
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="servicio">
                        Servicio
                    </label>

                    <select 
                        id="servicio"
                        name="servicio"
                        required
                        autocomplete="off"
                    >
                        <option value="">Cargando servicios...</option>
                    </select>

                </div>


                <div class="acciones">

                    <button 
                        type="submit"
                        class="btn-primary"
                    >
                        Crear turno
                    </button>


                    <button
                        type="button"
                        id="btnVolver"
                        class="btn-secondary"
                    >
                        Volver al inicio
                    </button>

                </div>

            </form>

        </section>



        <!-- Lista de turnos -->
        <section class="card">

            <h2>
                Turnos registrados
            </h2>


            <p 
                id="mensaje"
                class="mensaje"
            >
                No hay turnos registrados
            </p>


            <ul 
                id="listaTurnos"
                class="lista-turnos"
            >
            </ul>


        </section>


    </main>


    <script 
        type="module"
        src="../js/turnos.js">
    </script>

</body>

</html>
