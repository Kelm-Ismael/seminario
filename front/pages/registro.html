<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - David Martinez</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
            <div>
                <h1 class="logo-title">David Martinez</h1>
                <p class="logo-subtitle">Estilista Unisex</p>
            </div>
        </header>

        <main class="auth-body">
            <div class="auth-card auth-card--ancha">

                <div class="auth-card-header">
                    <h2>Completá tus datos para crear tu cuenta</h2>
                </div>

                <form id="formRegistro">

                    <div class="fila">
                        <div class="form-group">
                            <label for="nombre">Nombre *</label>
                            <div class="input-icon-group">
                                <span class="icon">👤</span>
                                <input type="text" id="nombre" name="nombre" placeholder="John" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="apellido">Apellido *</label>
                            <div class="input-icon-group">
                                <span class="icon">👤</span>
                                <input type="text" id="apellido" name="apellido" placeholder="Doe" required>
                            </div>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de nacimiento *</label>
                            <div class="input-icon-group">
                                <span class="icon">📅</span>
                                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="celular">Celular *</label>
                            <div class="input-icon-group">
                                <span class="icon">📱</span>
                                <span class="celular-prefijo">+54</span>
                                <input type="tel" id="celular" name="celular" placeholder="3794000000" inputmode="numeric" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <div class="input-icon-group">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña * (mín. 8 caracteres, con mayúscula, minúscula y número)</label>
                        <div class="input-icon-group">
                            <span class="icon">🔒</span>
                            <input type="password" id="password" name="password" minlength="8"
                                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}"
                                title="Debe tener al menos 8 caracteres, con una mayúscula, una minúscula y un número"
                                required>
                            <button type="button" id="togglePassword" class="toggle-visibility" aria-label="Mostrar contraseña">👁️</button>
                        </div>
                    </div>

                    <p id="mensaje" class="mensaje"></p>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Crear cuenta</button>
                        <div id="googleBtnContainer" style="display:flex;align-items:center;justify-content:center;"></div>
                    </div>

                    <p class="auth-switch">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
                    <p class="auth-switch">¿Ya te registraste pero no activaste tu cuenta? <a href="confirmar-cuenta.html">Activar cuenta</a></p>

                </form>

            </div>
        </main>

    </div>

    <script type="module" src="../js/registro/registro.js"></script>
    <script type="module" src="../js/registro/googleAuth.js"></script>

</body>

</html>
