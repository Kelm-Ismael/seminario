<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Clientes</title>

    <link rel="stylesheet" href="../css/turno.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/global.css">
    
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>👤 Gestión de Clientes</h1>
            <p>Alta y listado de clientes</p>
        </header>
         <nav class="nav-links">
            <a href="../index.html">Inicio</a>
        </nav>


        <!-- Formulario de creación -->
        <section class="card">

            <h2>Nuevo cliente</h2>

            <form id="formCliente" class="form-turno">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="created_at">Fecha y hora</label>
                    <input type="datetime-local" id="created_at" name="created_at" required>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn-primary">Crear cliente</button>
                    

                    <button class="btn btn-secondary" onclick="history.back()">
                        ← Volver a turnos
                    </button>
                </div>
               
            </form>

        </section>


        <!-- Listado de clientes -->
        <section class="card">

            <h2>Clientes registrados</h2>

            <p id="mensaje" class="mensaje">No hay clientes registrados</p>

            <table class="lista-turnos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Fecha y hora</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-clientes">
                </tbody>
            </table>

        </section>

    </main>

   <button id="btnVolver" class="btn">
        ← Volver
    </button>
    

    <script type="module" src="../js/clientes/clientes.js"></script>

</body>

</html>
