<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Completar registro con Google - David Martinez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/theme-public.css">
    <link rel="stylesheet" href="../css/login/auth.css">
    <link rel="stylesheet" href="../css/login/registro.css">
</head>

<body>

    <div class="auth-page">

        <header class="auth-topbar">
            <a href="../index.html" aria-label="Ir al inicio">
                <img src="../assets/logo/logo.png" alt="Logo" class="logo-img">
                <div>
                    <h1 class="logo-title">David Martinez</h1>
                    <p class="logo-subtitle">Estilista Unisex</p>
                </div>
            </a>
        </header>

        <main class="auth-body">
            <div class="auth-card auth-card--ancha">

                <div class="auth-card-header">
                    <h2>¡Ya casi terminás!</h2>
                    <p>Nos faltan estos datos para completar tu cuenta de Google</p>
                </div>

                <form id="formCompletarGoogle">

                    <div class="fila">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">👤</span>
                                <input type="text" id="nombre" name="nombre" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">👤</span>
                                <input type="text" id="apellido" name="apellido" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-icon-group">
                            <span class="icon" aria-hidden="true">✉️</span>
                            <input type="email" id="email" name="email" readonly>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de nacimiento *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">📅</span>
                                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" autocomplete="bday" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="celular">Celular *</label>
                            <div class="input-icon-group">
                                <span class="icon" aria-hidden="true">📱</span>
                                <input type="tel" id="celular" name="celular" value="+" placeholder="+ código de país y número" maxlength="16" inputmode="tel" autocomplete="tel" aria-describedby="celularHint" required>
                            </div>
                            <small id="celularHint" class="form-hint">Con “+” y código de país, entre 8 y 15 dígitos.</small>
                        </div>
                    </div>


                    <div class="check-terminos">
                        <input type="checkbox" id="aceptaTerminos" name="aceptaTerminos" required>
                        <label for="aceptaTerminos">Acepto los <a href="terminos.html" target="_blank" rel="noopener">Términos y Condiciones</a> y la <a href="terminos.html#privacidad" target="_blank" rel="noopener">Política de Privacidad</a> *</label>
                    </div>
                    <p class="nota-obligatorios">(*) Los campos marcados con asterisco son obligatorios.</p>

                    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

                    <div class="form-actions form-actions--una">
                        <button type="submit" class="btn-primary">Finalizar registro</button>
                    </div>

                </form>

            </div>
        </main>

    </div>

    <script type="module" src="../js/registro/completarRegistroGoogle.js"></script>

</body>

</html>
