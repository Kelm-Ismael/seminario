<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial | Panel Peluquero</title>

<link rel="stylesheet" href="../../css/cliente/theme-public.css">
<link rel="stylesheet" href="../../css/cliente/variables.css">
<link rel="stylesheet" href="../../css/cliente/sidebar.css">
<link rel="stylesheet" href="../../css/cliente/navbar.css">
<link rel="stylesheet" href="../../css/cliente/cards.css">
<link rel="stylesheet" href="../../css/cliente/table.css">
<link rel="stylesheet" href="../../css/cliente/buttons.css">
<link rel="stylesheet" href="../../css/peluquero/peluquero.css">
</head>
<body>

<aside id="sidebar">
    <div class="panel-brand">
        <div class="avatar-initials avatar-md" id="brand-avatar">DM</div>
        <div class="panel-brand-info">
            <h2>David Martínez</h2>
            <p>Panel Peluquero</p>
        </div>
    </div>

    <nav class="sidebar-menu">
        <a href="./inicio.html"><span class="icon">🏠</span> Inicio</a>
        <a href="./agenda.html"><span class="icon">📅</span> Mi agenda</a>
        <a href="./clientes.html"><span class="icon">👥</span> Clientes</a>
        <a href="./historial.html" class="active"><span class="icon">🕓</span> Historial</a>
        <a href="./perfil.html"><span class="icon">👤</span> Perfil</a>
    </nav>

    <div class="sidebar-divider"></div>

    <div class="panel-help">
        Cualquier duda con tu agenda, escribinos.
        <br>
        <a href="https://wa.me/5493764000000" target="_blank">Asistencia por WhatsApp</a>
    </div>
</aside>

<div class="main-content">

    <header class="panel-topbar">
        <div class="panel-greeting">
            <h1>Hola, <span id="saludo-nombre">—</span> 👋</h1>
            <p id="saludo-fecha">—</p>
        </div>
        <div class="panel-topbar-actions">
            <div class="panel-bell" title="Notificaciones">🔔</div>
            <div class="panel-user">
                <div class="avatar-initials avatar-sm" id="user-avatar">--</div>
                <span id="user-nombre">Cargando…</span>
            </div>
        </div>
    </header>

    <div class="panel-content">

        <section class="card">
            <div class="card-header-row">
                <h3>Historial de turnos</h3>
            </div>

            <div class="tabs" id="historial-tabs">
                <button class="tab active" data-estado="todos">Todos</button>
                <button class="tab" data-estado="finalizado">Finalizados</button>
                <button class="tab" data-estado="cancelado">Cancelados</button>
            </div>

            <!--
              Nota: uso .tabla y .badge-{estado} asumiendo que table.css los define
              así (según lo descripto). Si el nombre real de las clases de badge
              es distinto, avisame y lo ajusto en un segundo.
            -->
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Servicio</th>
                        <th>Precio</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-tbody">
                    <tr><td colspan="5">Cargando historial…</td></tr>
                </tbody>
            </table>

        </section>

    </div>
</div>

<script type="module" src="../../js/peluquero/historial.js"></script>
</body>
</html>
