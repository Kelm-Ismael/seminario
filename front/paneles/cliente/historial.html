<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Cliente | Historial</title>
<link rel="stylesheet" href="../../css/cliente/theme-public.css">
<link rel="stylesheet" href="../../css/cliente/variables.css">
<link rel="stylesheet" href="../../css/cliente/sidebar.css">
<link rel="stylesheet" href="../../css/cliente/navbar.css">
<link rel="stylesheet" href="../../css/cliente/cards.css">
<link rel="stylesheet" href="../../css/cliente/table.css">
<link rel="stylesheet" href="../../css/cliente/buttons.css">
</head>
<body>

<div class="dashboard">

    <aside id="sidebar">
        <div class="panel-brand">
            <div class="avatar-initials avatar-md">DM</div>
            <div class="panel-brand-info">
                <h2>David Martínez</h2>
                <p>Estilista Unisex</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="clientes.html"><span class="icon">🏠</span> Inicio</a>
            <a href="reservar-turno.html"><span class="icon">📅</span> Reservar turno</a>
            <a href="mis-turnos.html"><span class="icon">🕐</span> Mis turnos</a>
            <a href="historial.html" class="active"><span class="icon">📖</span> Historial</a>
            <a href="favoritos.html"><span class="icon">⭐</span> Mis favoritos</a>
            <a href="perfil.html"><span class="icon">👤</span> Perfil</a>
            <a href="promociones.html"><span class="icon">🏷️</span> Promociones</a>
            <a href="notificaciones.html"><span class="icon">🔔</span> Notificaciones</a>
            <a href="contacto.html"><span class="icon">📞</span> Contacto</a>
        </nav>

        <div class="panel-help">
            ¿Necesitás ayuda?
            <a href="https://wa.me/5491112345678" target="_blank" rel="noreferrer">
                💬 Escribinos por WhatsApp
            </a>
        </div>
    </aside>

    <main class="main-content">

        <header class="panel-topbar">
            <div class="panel-greeting">
                <h1>Hola, Juan 👋</h1>
                <p>¿Listo para tu próximo cambio?</p>
            </div>
            <div class="panel-topbar-actions">
                <div class="panel-bell">🔔</div>
                <div class="panel-user">
                    <div class="avatar-initials avatar-sm">JP</div>
                    <span>Juan Pérez</span>
                    <span>▾</span>
                </div>
            </div>
        </header>

        <div class="panel-content">
            <div class="card">
                <!--
                  "No asistidos" no existe como estado en la base (solo pendiente/
                  confirmado/cancelado/finalizado), así que esa pestaña va a
                  mostrar siempre "sin turnos" hasta que el backend agregue ese estado.
                -->
                <div class="tabs" id="historialTabs">
                    <button class="tab active" data-estado="todos">Todos</button>
                    <button class="tab" data-estado="finalizado">Completados</button>
                    <button class="tab" data-estado="cancelado">Cancelados</button>
                    <button class="tab" data-estado="no_asistido">No asistidos</button>
                </div>

                <div id="historialLista">
                    <p class="mensaje">Cargando…</p>
                </div>
            </div>
        </div>

    </main>

</div>

<script src="../../js/clientes/panel-cliente.js" defer></script>
<script src="../../js/clientes/historial.js" defer></script>
</body>
</html>
